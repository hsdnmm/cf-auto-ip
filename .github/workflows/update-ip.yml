name: Auto Update Cloudflare IP

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 (北京时间早上 8:00) 运行
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run fetch script
        run: python fetch_ip.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ip.txt
          
          # 判断是否有改动，防止没有改动时 git commit 抛出 exit code 1
          if git status --porcelain | grep -q "ip.txt"; then
            git commit -m "auto: update ip.txt [skip ci]"
            git push
          else
            echo "ip.txt 没有变化，无需提交"
          fi
