name: Auto Update Cloudflare IP

on:
  schedule:
    # 每天 UTC 0:00 (即北京时间早上 8:00) 定时运行
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动点击触发
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 赋予写入仓库权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run fetch script
        run: python fetch_ip.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ct_fastest.txt cu_fastest.txt ip.txt
          # 检查是否有文件更新，若无更新则忽略提交
          if git diff --staged --quiet; then
            echo "No changes in IP files."
          else
            git commit -m "auto: update fastest CT & CU IPs [skip ci]"
            git push
          fi
